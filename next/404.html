<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Routine | CSE </title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
<script>
    // If the URL only differs by letter case from a real file (e.g. /CGPA vs /cgpa.html),
    // retry with the lowercased path before showing the 404 UI.
    (function () {
        const path = window.location.pathname;
        const lower = path.toLowerCase();
        if (lower !== path) {
            const tried = sessionStorage.getItem('case-redirect-tried');
            if (!tried) {
                sessionStorage.setItem('case-redirect-tried', '1');
                window.location.replace(lower + window.location.search + window.location.hash);
            }
        }
    })();
</script>
</head>
<body class="bg-[#0a0a0a] text-[#888888] antialiased selection:bg-blue-500/30 min-h-screen flex flex-col">

<nav class="bg-[#000000] border-b border-neutral-900 sticky top-0 z-50 shrink-0">
    <div class="max-w-6xl mx-auto px-4 h-11 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-blue-500 shadow-sm shadow-blue-500/50"></div>
            <span class="text-white font-medium tracking-tight text-xs font-mono">Routine |CSE </span>
        </div>
        <div class="text-[10px] font-mono bg-[#111] border border-neutral-800 text-neutral-400 px-2 py-0.5 rounded">
            404
        </div>
    </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-16 w-full flex-1 flex flex-col items-center justify-center text-center gap-6">

    <div class="bg-[#050505] border border-neutral-900 rounded-xl px-8 py-10 flex flex-col items-center gap-4 max-w-md w-full">
        <div class="text-blue-500 text-5xl font-bold font-mono tracking-tight">404</div>
        <div>
            <h1 class="text-white font-semibold text-base">Page not found</h1>
            <p class="text-sm text-neutral-500 mt-2">
                The page you're looking for doesn't exist, or the URL's case doesn't match a file on this site (GitHub Pages is case-sensitive).
            </p>
        </div>
        <div id="requested-path" class="text-[11px] font-mono bg-[#111] border border-neutral-800 text-neutral-500 px-3 py-1.5 rounded-md break-all"></div>
        <a href="/class-routine/cgpa.html" class="text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-md transition-colors shadow-sm shadow-blue-500/20 w-full">
            Go to Home
        </a>
    </div>

</main>

<footer class="border-t border-neutral-900 bg-[#000000] shrink-0">
    <div class="max-w-6xl mx-auto px-4 py-2 flex flex-col sm:flex-row justify-between items-center gap-1 text-[10px]">
        <a href="https://github.com/s8rr/class-routine" target="_blank" rel="noopener noreferrer" class="text-neutral-600 hover:text-neutral-400">Source on GitHub</a>
        <div class="text-neutral-500 font-mono">Made by <a href="https://sabbir.cc" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300">Sabbir</a></div>
    </div>
</footer>

<script>
    document.getElementById('requested-path').textContent = window.location.pathname;
</script>

</body>
</html>
