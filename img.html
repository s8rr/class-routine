<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routine Images | Spring 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#000000] text-[#888888] antialiased selection:bg-blue-500/30">

    <nav class="bg-[#000000] border-b border-neutral-900 sticky top-0 z-50 mt-2">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm shadow-blue-500/50"></div>
                <span class="text-white font-medium tracking-tight text-sm font-mono">Routine Image Index</span>
            </div>
            <a href="index.html" class="text-xs font-mono bg-[#111] border border-neutral-800 text-neutral-400 hover:text-white hover:bg-neutral-900 transition-colors px-3 py-1.5 rounded">
                &larr; Back to Routine
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12 space-y-8">
        <div class="flex justify-between items-baseline">
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">Image Index</h2>
                <p class="text-xs text-neutral-500 mt-1 font-mono">Directory: <span class="text-neutral-400">/routine_images/</span></p>
            </div>
            <span id="image-count" class="text-xs font-mono text-neutral-500">Loading...</span>
        </div>
        
        <div id="image-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        </div>
    </main>

    <footer class="border-t border-neutral-900 bg-[#000000] mt-24">
        <div class="max-w-3xl mx-auto px-6 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <div class="space-y-1 text-center sm:text-left">
                <span class="text-white font-medium font-mono">Made by </span> <a href="https://sabbir.cc" class="hover:text-white transition-colors">sabbir</a>
                <p class="text-[11px] text-neutral-600">Code <a href="https://github.com/s8rr/class-routine" class="hover:text-neutral-400 transition-colors">repository</a></p> 
            </div>
            <div class="text-neutral-500 font-mono">
                System status: <span class="text-green-500">Indexed</span>
            </div>
        </div>
    </footer>

    <script>

        const imageFiles = [
            "monday_routine.png",
            "tuesday_routine.png",
            "wednesday_routine.jpg",
            "thursday_routine.jpg",
            "friday_routine.png"
        ];

        const imageDirectory = "routine_images/";

        const gridElement = document.getElementById('image-grid');
        const countElement = document.getElementById('image-count');

        countElement.textContent = `${imageFiles.length} files found`;

        imageFiles.forEach(filename => {
            const card = document.createElement('div');
            card.className = "bg-[#050505] border border-neutral-900 rounded-xl overflow-hidden group cursor-pointer hover:border-neutral-700 transition-colors";
            
            card.innerHTML = `
                <div class="aspect-[4/3] bg-[#0a0a0a] border-b border-neutral-900 relative overflow-hidden">
                    <img 
                        src="${imageDirectory}${filename}" 
                        alt="${filename}" 
                        class="w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-105 transition-all duration-300"
                        loading="lazy"
                    >
                </div>
                <div class="p-3 flex items-center justify-between">
                    <span class="text-xs font-mono text-neutral-400 truncate pr-2" title="${filename}">${filename}</span>
                    <a href="${imageDirectory}${filename}" target="_blank" class="text-neutral-600 hover:text-white transition-colors" title="Open original">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            `;
            gridElement.appendChild(card);
        });
    </script>
</body>
</html>
